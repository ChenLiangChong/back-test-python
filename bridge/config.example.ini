; 群益 SKCOM bridge 設定 — 複製成 config.ini 後修改 (config.ini 已被 .gitignore 排除)

[capital]
; 身分證字號 (大寫). 也可以用環境變數 CAPITAL_USER_ID
user_id = A123456789
; 建議留空, 改用環境變數 CAPITAL_PASSWORD
password =
; 已註冊的 SKCOM.dll 路徑 (位元數需與 Python 相同, 建議 x64)
dll_path = C:\SKCOM\x64\SKCOM.dll
log_path = C:\SKCOM\logs
; 留空 = 自動從 OnAccount 取 TF (期貨) / TS (證券) 帳號
futures_account =
stock_account =
; true = 群益測試環境 (SKCenterLib_SetAuthority(2))
test_env = true

[bridge]
listen_host = 127.0.0.1
listen_port = 9101
; false = 只轉發報價, 引擎送來的委託一律拒絕 (dry run). 驗證完成後才改 true
allow_orders = false
; 非同步下單 (OnAsyncOrder 回報); 若有問題改 false (同步, 會阻塞 COM 執行緒)
async_orders = true
; 是否轉發試撮 (nSimulate=1) tick. 引擎會忽略它們
forward_trial_ticks = false
; bridge 端的每秒下單上限 (引擎端另有風控)
max_orders_per_sec = 5
